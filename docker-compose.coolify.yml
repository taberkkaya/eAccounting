# Variant for deployment through Coolify.
#
# Coolify runs its own reverse proxy on 80/443 and terminates TLS there, so nothing
# here publishes a host port and Caddy inside the client serves plain HTTP on the
# internal network. Everything else - the static bundle, the /api proxy, the demo
# sandbox behaviour - is identical to the standalone stack.
#
# Set the environment variables in Coolify's UI; they are the same ones .env.example
# documents.
services:
  api:
    build:
      context: ./eAccountingServer
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: ${SQL_CONNECTION_STRING}
      Jwt__SecretKey: ${JWT_SECRET}
      Jwt__Issuer: eAccounting
      Jwt__Audience: eAccounting
      Database__MigrateOnStartup: "true"
      # Onay ve parola sıfırlama jetonlarını şifreleyen anahtarlar; kalıcı
      # olmazsa her dağıtımdan sonra gönderilmiş bağlantılar geçersiz olur.
      DataProtection__KeysPath: /keys
      # Hesabıyla giriş yapabilmek için önce e-posta adresini doğrulaması gerekir.
      Identity__RequireConfirmedEmail: ${REQUIRE_CONFIRMED_EMAIL:-true}
      # Mail gönderimi: SmtpHost boşsa mailler sessizce düşürülür.
      Mail__From: ${MAIL_FROM:-}
      Mail__SmtpHost: ${MAIL_SMTP_HOST:-}
      Mail__SmtpPort: ${MAIL_SMTP_PORT:-587}
      Mail__Username: ${MAIL_USERNAME:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__ClientBaseUrl: ${PUBLIC_URL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Demo__Enabled: "true"
      Demo__DatabaseNamePrefix: ${DEMO_DB_PREFIX}
      Demo__SlotCount: ${DEMO_SLOT_COUNT}
      Demo__WriteLimit: "40"
      Demo__NudgeAfterWrites: "15"
      Demo__IdleTimeoutMinutes: ${DEMO_IDLE_MINUTES:-5}
      # Oturum ömrü. Havuz üç sandbox, uzun oturum sıradakini bekletiyor.
      Demo__AbsoluteTimeoutMinutes: ${DEMO_SESSION_MINUTES:-10}
      Demo__MemoryThresholdMegabytes: ${DEMO_MEMORY_MB}
      Demo__ContactUrl: ${CONTACT_URL}
      # Demoya girmeden önce e-posta doğrulaması. Mail ayarları boşken kod
      # gönderilemeyeceği için doğrulama kendiliğinden devre dışı kalır.
      Demo__RequireEmailVerification: "true"
      # The client reaches the API through Caddy on the same origin, so no CORS entry.
      Cors__AllowedOrigins__0: ""
    volumes:
      - dataprotection-keys:/keys
    healthcheck:
      # Coolify dağıtımda yeni konteynere ne zaman geçeceğini buradan anlıyor;
      # bu olmadan eski konteyner kapanıp yenisi hazır olana kadar açık bir
      # sayfadan gelen istek boşluğa düşüyordu.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Migration ve demo havuzunun hazırlanması birkaç saniye sürüyor.
      start_period: 30s
    restart: unless-stopped

  client:
    build:
      context: ./eAccountingClient
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Coolify assigns the public domain and handles the certificate; Caddy here
      # only answers on plain HTTP inside the Docker network.
      SERVICE_FQDN_CLIENT_80: ${SERVICE_FQDN_CLIENT_80}
      SITE_ADDRESS: ":80"
    expose:
      - "80"
    healthcheck:
      # Caddy'nin kendi yönetim ucu; site bloğu alan adına bağlı olduğu için
      # localhost üzerinden içerik istemek doğru cevabı vermez.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  dataprotection-keys:
