name: eaccounting

# The database is external by default: a deployment usually already has a SQL Server
# it pays for, and running another one costs 2 GB of RAM for nothing. To get a
# self-contained stack with its own SQL Server instead, add the override file:
#
#   docker compose -f docker-compose.yml -f docker-compose.sqlserver.yml up -d
services:
  api:
    build:
      context: ./eAccountingServer
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: ${SQL_CONNECTION_STRING:?set SQL_CONNECTION_STRING in .env}
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET in .env}
      Jwt__Issuer: eAccounting
      Jwt__Audience: eAccounting
      Database__MigrateOnStartup: "true"
      Identity__RequireConfirmedEmail: "false"
      # Mail gönderimi: SmtpHost boşsa mailler sessizce düşürülür.
      Mail__From: ${MAIL_FROM:-}
      Mail__SmtpHost: ${MAIL_SMTP_HOST:-}
      Mail__SmtpPort: ${MAIL_SMTP_PORT:-587}
      Mail__Username: ${MAIL_USERNAME:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__ClientBaseUrl: ${PUBLIC_URL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Demo__Enabled: "true"
      # Sandbox databases reuse the server and credentials of the connection string
      # above; only their names differ. They must already exist when the database
      # user cannot create databases, which is the norm on managed hosting.
      Demo__DatabaseNamePrefix: ${DEMO_DB_PREFIX:-eAccounting_Demo_Slot}
      Demo__SlotCount: ${DEMO_SLOT_COUNT:-3}
      Demo__WriteLimit: "40"
      Demo__NudgeAfterWrites: "15"
      Demo__IdleTimeoutMinutes: "15"
      Demo__AbsoluteTimeoutMinutes: "45"
      Demo__MemoryThresholdMegabytes: ${DEMO_MEMORY_MB:-768}
      Demo__ContactUrl: ${CONTACT_URL:-https://ataberkkaya.com}
      # Empty by default: Caddy serves the client on the same origin as the API.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-}
    restart: unless-stopped

  client:
    build:
      context: ./eAccountingClient
    depends_on:
      - api
    environment:
      # A bare domain makes Caddy provision a certificate; ":80" keeps a local run
      # on plain HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_AGREE: "true"
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # Certificates must survive a restart, or Let's Encrypt rate limits are hit
      # after a few redeploys.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
