# Adds a SQL Server to the stack for a self-contained deployment - useful locally, or
# when no managed SQL Server is available. Costs about 2 GB of RAM.
#
#   docker compose -f docker-compose.yml -f docker-compose.sqlserver.yml up -d
#
# SQL_CONNECTION_STRING is overridden here, so .env only needs MSSQL_SA_PASSWORD.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=eAccountingServerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      # The bundled server lets the app create its own sandbox databases.
      Demo__DatabaseNamePrefix: eAccounting_Demo_Slot

volumes:
  sqlserver-data:
