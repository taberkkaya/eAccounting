<aside class="ak-sidebar" [class.is-open]="open">
  <a routerLink="/" class="ak-brand" title="Defter" (click)="navigated.emit()">
    <!-- Şerit görünümünde marka yazısı gizlendiği için baş harf tek başına kalır. -->
    <span class="ak-brand__mark" aria-hidden="true">D</span>
    <span class="ak-brand__text">
      Defter
      <span>ön muhasebe</span>
    </span>
  </a>

  <div class="ak-sidebar__user">
    <div class="ak-avatar">{{ initials }}</div>
    <div style="min-width: 0">
      <div class="ak-sidebar__user-name">{{ auth.user.name }}</div>
      <div class="ak-sidebar__user-role">
        {{ auth.user.isAdmin ? "Yönetici" : "Kullanıcı" }}
      </div>
    </div>
  </div>

  <div class="ak-sidebar__search">
    <input
      [(ngModel)]="search"
      type="search"
      class="ak-input"
      placeholder="Menüde ara"
    />
  </div>

  <nav class="ak-nav">
    @for(menu of menus | menu: search; track menu.name){ @if(menu.isTitle){
    <div class="ak-nav__title">{{ menu.name }}</div>
    }@else {
    <a
      [routerLink]="menu.url"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: menu.url === '/' }"
      class="ak-nav__link"
      [title]="collapsed ? menu.name : ''"
      (click)="navigated.emit()"
    >
      <i class="{{ menu.icon }}"></i>
      <span>{{ menu.name }}</span>
    </a>
    } }@empty {
    <div class="ak-nav__empty">Eşleşen menü yok.</div>
    }
  </nav>
</aside>
