<header class="ak-topbar">
  <button
    type="button"
    class="ak-topbar__toggle"
    (click)="menuToggled.emit()"
    aria-label="Menüyü aç"
  >
    <i class="fas fa-bars"></i>
  </button>

  @if(auth.user.companies.length > 0){
  <select
    (change)="changeCompany()"
    class="ak-select"
    style="width: auto; min-width: 190px"
    [(ngModel)]="auth.user.companyId"
    aria-label="Firma seçimi"
  >
    @for(company of auth.user.companies; track company.Id){
    <option [value]="company.Id">{{ company.Name }}</option>
    }
  </select>
  }

  <app-demo-banner></app-demo-banner>

  <div class="ak-topbar__spacer"></div>

  <button type="button" class="ak-logout" (click)="logout()" title="Oturumu kapat">
    <i class="fas fa-power-off"></i>
    <span>Çıkış</span>
  </button>
</header>
